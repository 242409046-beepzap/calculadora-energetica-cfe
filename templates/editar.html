<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Electrodoméstico</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f0f2f5; }
        .card-custom { border: none; border-radius: 15px; box-shadow: 0 6px 15px rgba(0,0,0,0.08); background: white; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="container" style="max-width: 500px;">
        <div class="card card-custom p-4">
            <h3 class="fw-bold text-primary mb-3 text-center">✏️ Editar {{ aparato.nombre }}</h3>
            
            <form action="/actualizar/{{ aparato.id_electrodomestico }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nombre del Electrodoméstico</label>
                    <input type="text" name="nombre" class="form-control" value="{{ aparato.nombre }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Potencia (Watts)</label>
                    <input type="number" step="0.01" name="potencia" class="form-control" value="{{ aparato.potencia_watts }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Horas de uso al día</label>
                    <input type="number" step="0.1" name="horas" class="form-control" value="{{ aparato.horas_diarias }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Días de uso al mes</label>
                    <input type="number" name="dias" class="form-control" value="{{ aparato.dias_mes }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">URL de la Imagen</label>
                    <input type="url" name="imagen_url" class="form-control" value="{{ aparato.imagen_url }}">
                </div>
                <div class="d-flex gap-2 mt-4">
                    <a href="/" class="btn btn-secondary w-50">Cancelar</a>
                    <button type="submit" class="btn btn-primary w-50">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
